<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>KayTaxi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ═══════════════════════════════════════════
   KAYTAXI MVP — Design System
═══════════════════════════════════════════ */
:root{
  --bg:#0e0c09;
  --bg2:#181410;
  --bg3:#221e18;
  --surface:#2a2420;
  --surface2:#332e27;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.14);
  --orange:#ff7733;
  --orange-dark:#cc5a20;
  --orange-glow:rgba(255,119,51,0.18);
  --yellow:#ffd23f;
  --yellow-dark:#cc9f00;
  --green:#22c55e;
  --green-dark:#16a34a;
  --red:#ef4444;
  --blue:#3b82f6;
  --text:#f0ede8;
  --text2:#a09890;
  --text3:#6b635a;
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:7px;
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --shadow-sm:0 2px 12px rgba(0,0,0,0.35);
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
input,button,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* ═══ LAYOUT ═══ */
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-area::-webkit-scrollbar{display:none}

/* ═══ TOP BAR ═══ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  padding-top:max(16px,env(safe-area-inset-top));
}
.topbar-title{font-size:18px;font-weight:700}
.topbar-back{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px}

/* ═══ BOTTOM NAV ═══ */
.bottomnav{
  display:flex;background:var(--bg2);
  border-top:1px solid var(--border);
  padding:8px 0 max(12px,env(safe-area-inset-bottom));
  flex-shrink:0;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--text3);transition:color .15s}
.nav-item.active{color:var(--orange)}
.nav-icon{font-size:22px;line-height:1}

/* ═══ BUTTONS ═══ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 20px;border-radius:var(--radius);
  font-size:16px;font-weight:700;transition:all .15s;
  border:none;cursor:pointer;
}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:active{background:var(--orange-dark);transform:scale(.98)}
.btn-secondary{background:var(--surface);color:var(--text)}
.btn-secondary:active{background:var(--surface2)}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text)}
.btn-sm{padding:10px 16px;font-size:14px;border-radius:var(--radius-sm)}
.btn-green{background:var(--green);color:#fff}
.btn-yellow{background:var(--yellow);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-icon{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;padding:0;flex-shrink:0}

/* ═══ INPUTS ═══ */
.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.input-label{font-size:13px;color:var(--text2);font-weight:500}
.input{
  width:100%;padding:13px 16px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;
  transition:border-color .15s;
  outline:none;
}
.input:focus{border-color:var(--orange)}
.input::placeholder{color:var(--text3)}

/* ═══ CARDS ═══ */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.card+.card{margin-top:10px}

/* ═══ BADGES / PILLS ═══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.badge-orange{background:var(--orange-glow);color:var(--orange)}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-yellow{background:rgba(255,210,63,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* ═══ DIVIDER ═══ */
.divider{height:1px;background:var(--border);margin:14px 0}

/* ═══ ROW ═══ */
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}

/* ═══ TEXT UTILS ═══ */
.title{font-size:26px;font-weight:800;line-height:1.1}
.subtitle{font-size:14px;color:var(--text2)}
.label{font-size:13px;color:var(--text2);font-weight:500}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.orange{color:var(--orange)}
.green{color:var(--green)}
.red{color:var(--red)}
.muted{color:var(--text2)}
.bold{font-weight:700}
.center{text-align:center}

/* ═══ PADDING ═══ */
.pad{padding:20px}
.pad-x{padding-left:20px;padding-right:20px}
.pad-y{padding-top:20px;padding-bottom:20px}

/* ═══ AVATAR ═══ */
.avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--orange),var(--yellow));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;flex-shrink:0;
}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.sm{width:36px;height:36px;font-size:13px}

/* ═══ MAP ═══ */
#map-container{flex:1;position:relative;min-height:0}
#leaflet-map{width:100%;height:100%}
.map-overlay-top{position:absolute;top:12px;left:12px;right:12px;z-index:999;display:flex;gap:8px}
.map-overlay-bottom{
  position:absolute;bottom:0;left:0;right:0;z-index:999;
  background:var(--bg2);border-top:1px solid var(--border);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:16px 20px;
}
.map-pill{
  background:rgba(14,12,9,.85);backdrop-filter:blur(10px);
  border:1px solid var(--border2);border-radius:99px;
  padding:8px 14px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.drag-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}

/* ═══ VEHICLE OPTION ═══ */
.vehicle-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);
  background:var(--surface);
  transition:all .15s;cursor:pointer;
  margin-bottom:8px;
}
.vehicle-option.selected{border-color:var(--orange);background:var(--orange-glow)}
.vehicle-option:active{transform:scale(.99)}

/* ═══ PAYMENT METHOD ═══ */
.pay-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all .15s;margin-bottom:8px;
}
.pay-option.selected{border-color:var(--orange);background:var(--orange-glow)}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio-dot.on{border-color:var(--orange);background:var(--orange)}
.radio-dot.on::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

/* ═══ CHAT ═══ */
.chat-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.bubble-in{background:var(--surface2);border-bottom-left-radius:4px;align-self:flex-start}
.bubble-out{background:var(--orange);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chat-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2)}

/* ═══ RATING STARS ═══ */
.stars{display:flex;gap:6px}
.star{font-size:34px;cursor:pointer;transition:transform .1s;filter:grayscale(1);opacity:.4}
.star.active{filter:none;opacity:1;color:var(--yellow)}
.star:hover{transform:scale(1.15)}

/* ═══ WALLET CARD ═══ */
.wallet-card{
  background:linear-gradient(135deg,var(--orange-dark) 0%,var(--orange) 60%,var(--yellow) 100%);
  border-radius:var(--radius);padding:22px;color:#fff;
  position:relative;overflow:hidden;
}
.wallet-card::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.wallet-card::after{content:'';position:absolute;bottom:-40px;left:20px;width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.06)}

/* ═══ TRANSACTION ROW ═══ */
.txn-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.txn-row:last-child{border-bottom:none}
.txn-icon{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* ═══ HISTORY ROW ═══ */
.hist-row{
  display:flex;align-items:center;gap:12px;
  padding:14px;background:var(--surface);border-radius:var(--radius-sm);
  margin-bottom:10px;
}

/* ═══ DRIVER CARD ═══ */
.driver-found-card{
  background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;
  padding:20px;border-top:1px solid var(--border);
}

/* ═══ PROGRESS BAR ═══ */
.progress-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .5s ease}

/* ═══ RIPPLE PULSE ═══ */
@keyframes pulse-ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.pulse-ring{
  position:absolute;border-radius:50%;background:var(--orange);
  animation:pulse-ring 1.8s ease-out infinite;
}

/* ═══ SUPABASE STATUS ═══ */
#supabase-banner{
  background:rgba(255,119,51,.12);border-bottom:1px solid rgba(255,119,51,.3);
  padding:8px 16px;font-size:12px;color:var(--orange);
  display:flex;align-items:center;gap:6px;
}

/* ═══ TOAST ═══ */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border2);
  padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;transition:all .25s;z-index:9999;white-space:nowrap;
  pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ MODAL ═══ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  display:flex;align-items:flex-end;
  animation:fadeIn .2s;
}
.modal-sheet{
  width:100%;background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;
  padding:20px;max-height:90vh;overflow-y:auto;
}

/* ═══ OTP BOXES ═══ */
.otp-row{display:flex;gap:8px;justify-content:center}
.otp-box{
  width:56px;height:64px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border2);background:var(--surface);
  font-size:28px;font-weight:800;text-align:center;
  color:var(--text);outline:none;transition:border-color .15s;
}
.otp-box:focus{border-color:var(--orange)}

/* ═══ SWITCH ROLE ═══ */
.role-selector{display:flex;background:var(--surface);border-radius:var(--radius-sm);padding:4px;gap:4px;margin-bottom:20px}
.role-btn{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:14px;transition:all .15s;text-align:center;cursor:pointer}
.role-btn.active{background:var(--orange);color:#fff}
.role-btn:not(.active){color:var(--text2)}

/* ═══ LOADING SPINNER ═══ */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* ═══ SECTION TITLE ═══ */
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}

/* ═══ PROMO BANNER ═══ */
.promo-banner{
  background:linear-gradient(135deg,var(--orange-dark),var(--orange));
  border-radius:var(--radius);padding:16px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;
}

/* ═══ DRIVER CARD IN LIST ═══ */
.nearby-driver{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}

/* ═══ STATUS STEP ═══ */
.status-steps{display:flex;align-items:center;gap:6px;margin:16px 0}
.step-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.step-line{flex:1;height:2px;border-radius:1px}
.step-label{font-size:11px;color:var(--text3);text-align:center;flex:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<!-- Leaflet.js -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   KAYTAXI MVP — App Engine
   Stack: Vanilla JS + Supabase SDK (lazy-loaded) + Leaflet
═══════════════════════════════════════════════════════════ */

// ── CONFIG ──────────────────────────────────────────────────
const CONFIG = {
  SUPABASE_URL: 'https://zvebqjhwfoqpmrfckqzm.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2ZWJxamh3Zm9xcG1yZmNrcXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNDIxODksImV4cCI6MjA5NDkxODE4OX0.VqqpcGsfs5SZmKoUZMTNlafNQi7HQ8Q_o1ySZ_vfKAU',
  MAP_CENTER: [18.2009, -73.7510],  // Vil Okay, Ayiti
  MAP_ZOOM: 14,
  DEMO_MODE: false  // Supabase connecté ✓
};

// ── SUPABASE CLIENT ─────────────────────────────────────────
let supabase = null;
let realtimeChannel = null;
let gpsWatchId = null;

async function initSupabase() {
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    // Restore existing session
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      await loadUserProfile(session.user.id);
    }
    // Auth state changes
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        await loadUserProfile(session.user.id);
        const target = state.role==='driver' ? 'driver-home'
                     : state.role==='admin'  ? 'admin-dashboard'
                     : (state.user?.profile_complete ? 'home' : 'register');
        navigate(target);
      }
      if (event === 'SIGNED_OUT') { state.user = null; navigate('login'); }
    });
    console.log('✅ Supabase OK');
    return supabase;
  } catch(e) {
    console.error('Supabase:', e);
    showToast('Mode démo — Supabase non connecté');
    CONFIG.DEMO_MODE = true;
  }
}

// ── DB HELPERS ───────────────────────────────────────────────

async function loadUserProfile(userId) {
  if (!supabase) return;
  const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
  if (data) {
    state.user = {
      id: userId,
      name: data.full_name || 'Itilizatè',
      phone: data.phone || '',
      role: data.role || state.role,
      avatar: data.avatar_url,
      zone: data.zone,
      profile_complete: !!data.full_name,
    };
    state.role = data.role || state.role;
    await Promise.all([loadWallet(userId), loadHistory(userId)]);
    if (state.role === 'driver') await loadDriverData(userId);
    render();
  }
}

async function loadWallet(userId) {
  if (!supabase) return;
  const { data: w } = await supabase.from('wallets').select('balance').eq('user_id', userId).single();
  if (w) state.wallet.balance = parseFloat(w.balance);
  const { data: txns } = await supabase
    .from('wallet_transactions').select('*').eq('user_id', userId)
    .order('created_at', { ascending: false }).limit(15);
  if (txns) state.transactions = txns.map(tx => ({
    id: tx.id,
    icon: tx.type==='ride'?'🏍':tx.type==='topup'?'📱':tx.type==='bonus'?'🎁':'📦',
    label: tx.description,
    date: formatDate(tx.created_at),
    amount: parseFloat(tx.amount),
    type: parseFloat(tx.amount) > 0 ? 'in' : 'out',
  }));
}

async function loadHistory(userId) {
  if (!supabase) return;
  const { data } = await supabase.from('rides')
    .select('*, driver:profiles!rides_driver_id_fkey(full_name)')
    .eq('passenger_id', userId).order('created_at', { ascending: false }).limit(30);
  if (data) state.historyData = data.map(r => ({
    id: r.id, type: r.vehicle_type||'moto',
    from: r.pickup_address||'Soti', to: r.dropoff_address||'Ale',
    date: formatDate(r.created_at), price: parseFloat(r.fare||0),
    status: r.status==='completed'?'done':r.status==='cancelled'?'cancelled':'done',
    rating: r.passenger_rating||0,
  }));
}

async function loadDriverData(userId) {
  if (!supabase) return;
  const { data } = await supabase.from('driver_profiles').select('*').eq('user_id', userId).single();
  if (data) {
    state.driverData.earnings = parseFloat(data.today_earnings||0);
    state.driverData.rides = data.today_rides||0;
    state.driverData.rating = parseFloat(data.rating||5.0);
    state.driverData.onDuty = data.is_online||false;
  }
}

async function saveProfile(name, zone) {
  if (!supabase || !state.user?.id) return false;
  const { error } = await supabase.from('profiles').upsert({
    id: state.user.id, full_name: name, zone, role: state.role,
    updated_at: new Date().toISOString(),
  });
  if (!error) {
    state.user.name = name; state.user.zone = zone; state.user.profile_complete = true;
    await supabase.from('wallets').upsert({ user_id: state.user.id, balance: 0 }, { onConflict: 'user_id' });
    return true;
  }
  return false;
}

async function createRide(vehicleType, pickupAddr, dropoffAddr, fare) {
  if (!supabase || !state.user?.id) return null;
  const { data, error } = await supabase.from('rides').insert({
    passenger_id: state.user.id, vehicle_type: vehicleType,
    pickup_address: pickupAddr, pickup_lat: CONFIG.MAP_CENTER[0], pickup_lng: CONFIG.MAP_CENTER[1],
    dropoff_address: dropoffAddr, dropoff_lat: 18.1965, dropoff_lng: -73.7460,
    fare, status: 'searching',
  }).select().single();
  return error ? null : data;
}

async function updateRideStatus(rideId, status, extra={}) {
  if (!supabase || !rideId) return;
  await supabase.from('rides').update({ status, ...extra }).eq('id', rideId);
}

async function processPayment(amount, method) {
  if (!supabase || !state.user?.id) {
    state.wallet.balance = parseFloat((state.wallet.balance - amount).toFixed(2));
    return true;
  }
  const rideId = state.currentRide?.id;
  if (method === 'wallet') {
    const { error } = await supabase.from('wallets')
      .update({ balance: supabase.rpc ? undefined : state.wallet.balance - amount })
      .eq('user_id', state.user.id);
    // Use raw update
    await supabase.from('wallets').update({ balance: state.wallet.balance - amount }).eq('user_id', state.user.id);
  }
  await supabase.from('wallet_transactions').insert({
    user_id: state.user.id, type: 'ride',
    amount: -amount, description: `Kous · ${state.currentRide?.vehicle?.label||'Moto'}`,
    ride_id: rideId||null,
  });
  if (rideId) await updateRideStatus(rideId, 'completed');
  state.wallet.balance = parseFloat((state.wallet.balance - amount).toFixed(2));
  return true;
}

async function topupWallet(amount, method) {
  if (!supabase || !state.user?.id) {
    state.wallet.balance = parseFloat((state.wallet.balance + amount).toFixed(2));
    return true;
  }
  await supabase.from('wallets').update({ balance: state.wallet.balance + amount }).eq('user_id', state.user.id);
  await supabase.from('wallet_transactions').insert({
    user_id: state.user.id, type: 'topup',
    amount: amount, description: `Rechaje · ${method}`,
  });
  state.wallet.balance = parseFloat((state.wallet.balance + amount).toFixed(2));
  return true;
}

async function submitRating(rideId, rating, tip, comment) {
  if (!supabase) return;
  await supabase.from('ratings').insert({ ride_id: rideId, rated_by: state.user?.id, rating, tip, comment });
  if (rideId) await supabase.from('rides').update({ passenger_rating: rating }).eq('id', rideId);
}

// ── REALTIME ─────────────────────────────────────────────────

function subscribeToRide(rideId) {
  if (!supabase || !rideId) return;
  if (realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase.channel(`ride-${rideId}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rides', filter: `id=eq.${rideId}` },
      async (payload) => {
        const r = payload.new;
        if (r.status === 'accepted' && r.driver_id) {
          await loadDriverForRide(r.driver_id);
          navigate('driver-found');
        }
        if (r.status === 'in_progress') navigate('ride-inprogress');
        if (r.status === 'completed')   navigate('ride-done');
      })
    .subscribe();
}

async function loadDriverForRide(driverId) {
  if (!supabase) return;
  const { data } = await supabase.from('profiles')
    .select('*, driver_profiles(*)').eq('id', driverId).single();
  if (data) {
    state.currentRide = { ...state.currentRide, driver: {
      id: driverId, name: data.full_name,
      rating: data.driver_profiles?.[0]?.rating||4.9,
      rides: data.driver_profiles?.[0]?.total_rides||0,
      vehicle: data.driver_profiles?.[0]?.vehicle_name||'Moto',
      plate: data.driver_profiles?.[0]?.plate||'HT-XXXX',
      color: data.driver_profiles?.[0]?.vehicle_color||'N/A',
      eta: 2,
    }};
  }
}

function startDriverGPS() {
  if (!navigator.geolocation || !state.user?.id) return;
  gpsWatchId = navigator.geolocation.watchPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    if (supabase) {
      supabase.from('driver_locations').upsert(
        { driver_id: state.user.id, lat, lng, updated_at: new Date().toISOString() },
        { onConflict: 'driver_id' }
      );
    }
  }, null, { enableHighAccuracy: true, maximumAge: 3000 });
}

function stopDriverGPS() {
  if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
}

// ── CHAT ─────────────────────────────────────────────────────

async function loadMessages(rideId) {
  if (!supabase || !rideId) return;
  const { data } = await supabase.from('messages').select('*')
    .eq('ride_id', rideId).order('created_at');
  if (data) state.chatMessages = data.map(m => ({
    from: m.sender_id === state.user?.id ? 'passenger' : 'driver',
    text: m.content,
    time: new Date(m.created_at).toTimeString().slice(0,5),
  }));
}

async function sendMessage(content) {
  if (!content.trim()) return;
  if (!supabase || !state.currentRide?.id) {
    state.chatMessages.push({ from:'passenger', text:content, time: new Date().toTimeString().slice(0,5) });
    render(); return;
  }
  await supabase.from('messages').insert({
    ride_id: state.currentRide.id, sender_id: state.user?.id, content,
  });
  state.chatMessages.push({ from:'passenger', text:content, time: new Date().toTimeString().slice(0,5) });
  render();
  setTimeout(() => { const el = document.getElementById('chat-messages'); if(el) el.scrollTop=el.scrollHeight; }, 50);
}

function subscribeToChatRide(rideId) {
  if (!supabase || !rideId) return;
  supabase.channel(`chat-${rideId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `ride_id=eq.${rideId}` },
      (payload) => {
        const m = payload.new;
        if (m.sender_id !== state.user?.id) {
          state.chatMessages.push({ from:'driver', text:m.content, time: new Date(m.created_at).toTimeString().slice(0,5) });
          if (state.screen==='chat') render();
        }
      })
    .subscribe();
}

async function loadAdminStats() {
  if (!supabase) return;
  const today = new Date().toISOString().split('T')[0];
  const [ridesR, usersR] = await Promise.all([
    supabase.from('rides').select('id,fare,status').gte('created_at', today),
    supabase.from('profiles').select('id,role'),
  ]);
  const rides = ridesR.data || [];
  const users = usersR.data || [];
  state.adminStats = {
    todayRides: rides.length,
    todayRevenue: rides.reduce((s,r)=>s+parseFloat(r.fare||0), 0),
    totalUsers: users.filter(u=>u.role==='passenger').length,
    totalDrivers: users.filter(u=>u.role==='driver').length,
  };
}

// ── FORMAT ────────────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), diff = now - d;
  if (diff < 86400000) return d.toTimeString().slice(0,5);
  if (diff < 172800000) return 'Yè';
  return d.toLocaleDateString('fr', { day:'numeric', month:'short' });
}

            <div style="font-size:12px;color:var(--green);margin-top:2px">${s.change}</div>
          </div>
        `).join('')}

      <div class="section-title">Chofè aktif kounye a</div>
      ${DEMO_DRIVERS.map(d=>`
        <div class="card row" style="gap:12px;margin-bottom:10px">
          <div class="avatar sm">${d.name.slice(0,2)}</div>
          <div style="flex:1">
            <div class="bold" style="font-size:14px">${d.name}</div>
            <div class="label">${d.vehicle} · ${d.plate}</div>
          </div>
          <div style="text-align:right">
            <div class="badge badge-green" style="font-size:11px">Disponib</div>
            <div style="font-size:11px;color:var(--text3);margin-top:4px">⭐ ${d.rating}</div>
          </div>
        </div>
      `).join('')}

      <div class="section-title" style="margin-top:10px">Aksyon rapid</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${[['👥','Jere itilizatè'],['🏍','Jere chofè'],['🗺️','Wè kat live'],['📊','Rapò detaye']].map(([ic,lbl])=>`
          <button class="btn btn-secondary" style="flex-direction:column;gap:6px;padding:16px" onclick="showToast('${lbl} ap vini…')">

}

// ─────────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────────

async function handleLogin() {
  const email = document.getElementById('email-input')?.value?.trim().toLowerCase();
  if (!email || !email.includes('@')) { showToast('Antre yon imèl valid !'); return; }
  const btn = document.querySelector('#app .btn-primary');
  if (btn) { btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true; }

  state._loginEmail = email;

  if (!supabase) {
    navigate('otp'); startOTPTimer(); return;
  }
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: true }
  });
  if (error) {
    showToast('Erè: ' + error.message);
    if (btn) { btn.innerHTML = 'Voye kòd OTP ✉️'; btn.disabled = false; }
  } else {
    navigate('otp');
    startOTPTimer(60);
  }
}

function startOTPTimer(secs = 60) {
  let s = secs;
  const iv = setInterval(() => {
    s--;
    const el = document.getElementById('otp-timer');
    if (el) el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    if (s <= 0) clearInterval(iv);
  }, 1000);
}

async function resendOTP() {
  if (!state._loginEmail) { navigate('login'); return; }
  if (supabase) {
    await supabase.auth.signInWithOtp({ email: state._loginEmail, options: { shouldCreateUser: true } });
  }
  showToast('Nouvo kòd voye ✉️');
  startOTPTimer(60);
}

function handleOTPInput(input, idx) {
  input.value = input.value.replace(/\D/g,'').slice(-1);
  if (input.value) {
    const next = document.querySelectorAll('.otp-box')[idx+1];
    if (next) next.focus();
  }
  const boxes = document.querySelectorAll('.otp-box');
  const all = [...boxes].filter(b=>b).every(b => b.value);
  const btn = document.getElementById('verify-btn');
  if (btn) { btn.style.opacity = all?'1':'.5'; btn.style.pointerEvents = all?'auto':'none'; }
}

async function handleOTPVerify() {
  const boxes = document.querySelectorAll('.otp-box');
  const token = [...boxes].map(b=>b.value).join('');
  if (token.length < 6) { showToast('Antre 6 chif yo !'); return; }

  const btn = document.getElementById('verify-btn');
  if (btn) { btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true; }

  if (!supabase) {
    state.user = { name: state._loginEmail?.split('@')[0] || 'Itilizatè', email: state._loginEmail, role: state.role };
    const target = state.role==='driver'?'driver-home':state.role==='admin'?'admin-dashboard':'register';
    navigate(target); return;
  }

  const email = state._loginEmail;
  if (!email) { navigate('login'); return; }

  const { data, error } = await supabase.auth.verifyOtp({ email, token, type: 'email' });

  if (error) {
    showToast('❌ Kòd la pa bon — eseye ankò');
    if (btn) { btn.innerHTML='Verifye kòd la'; btn.disabled=false; }
  } else if (data?.user) {
    showToast('✓ Konekte!');
    // onAuthStateChange will navigate
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name')?.value?.trim() || '';
  if (!name) { showToast('Antre non ou !'); return; }
  const zone = document.querySelector('.badge-orange[onclick*="chwazi"]')?.textContent?.trim() || 'Okay';

  const btn = document.querySelector('#app .btn-primary');
  if (btn) { btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true; }

  const ok = await saveProfile(name, zone);
  if (ok || !supabase) {
    state.user = { ...state.user, name, zone, profile_complete: true };
    showToast('Kont kreye ✓');
    navigate('home');
  } else {
    showToast('Erè — eseye ankò');
    if (btn) { btn.innerHTML='Kontinye →'; btn.disabled=false; }
  }
}

async function startRideSearch() {
  state.rideStatus = 'searching';
  const vehicle = VEHICLES.find(v=>v.id===state.selectedVehicle) || VEHICLES[0];

  // Create ride in Supabase
  const ride = await createRide(vehicle.id, 'Sentèl, Okay', 'Lopital Imakile', vehicle.price);
  if (ride) {
    state.currentRide = { ...state.currentRide, id: ride.id, vehicle };
    subscribeToRide(ride.id);
  } else {
    // Demo fallback
    state.currentRide = { id: null, vehicle };
  }
  navigate('searching');
}

async function handlePayment(total) {
  const btn = document.querySelector('#app .btn-primary');
  if (btn) { btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true; }

  const ok = await processPayment(total, state.selectedPayment);
  if (ok) {
    showToast('Peman konfime ✓');
    navigate('rate-driver');
  } else {
    showToast('Erè peman — eseye ankò');
    if (btn) { btn.innerHTML=`Peye G ${total}`; btn.disabled=false; }
  }
}

async function handleTopup(amount) {
  const btn = document.querySelector('#app .btn-primary');
  if (btn) { btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true; }

  const ok = await topupWallet(amount, 'MonCash');
  if (ok) {
    showToast(`G ${amount} ajoute ✓`);
    await loadWallet(state.user?.id);
    navigate('wallet');
  } else {
    showToast('Erè rechaje');
    if (btn) { btn.innerHTML=`Rechaje G ${amount}`; btn.disabled=false; }
  }
}

async function toggleDriverDuty() {
  state.driverData.onDuty = !state.driverData.onDuty;
  if (state.driverData.onDuty) {
    showToast('Ou disponib kounye a 🟢');
    startDriverGPS();
    if (supabase && state.user?.id)
      await supabase.from('driver_profiles')
        .upsert({ user_id: state.user.id, is_online: true }, { onConflict: 'user_id' });
    // Simulate incoming request after 4s in demo
    if (!supabase || CONFIG.DEMO_MODE) {
      setTimeout(() => {
        if (state.driverData.onDuty && state.screen==='driver-home') {
          navigate('driver-ride-request');
        }
      }, 4000);
    } else {
      // Subscribe to new ride requests for this driver
      supabase.channel('new-rides')
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'rides', filter:'status=eq.searching' },
          async (payload) => {
            if (state.driverData.onDuty && state.screen==='driver-home') {
              state.driverData.pendingRide = payload.new;
              navigate('driver-ride-request');
            }
          })
        .subscribe();
    }
  } else {
    showToast('Mete on repos 🔴');
    stopDriverGPS();
    if (supabase && state.user?.id)
      await supabase.from('driver_profiles')
        .upsert({ user_id: state.user.id, is_online: false }, { onConflict: 'user_id' });
  }
  render();
}

async function handleRatingSubmit() {
  const rating = ScreenRateDriver._rating || 5;
  const tipIdx = ScreenRateDriver._tip || 0;
  const tips = [0,10,20,50,0];
  const tip = tips[tipIdx] || 0;
  const comment = document.querySelector('textarea')?.value || '';

  await submitRating(state.currentRide?.id, rating, tip, comment);
  navigate('payment-done');
}

function showNegotiateModal() {
  showToast('Negosyasyon nan vèsyon 2 !');
}

function saveSupabaseConfig() {
  const url = document.getElementById('sb-url')?.value;
  const key = document.getElementById('sb-key')?.value;
  if (url && key) {
    CONFIG.SUPABASE_URL = url;
    CONFIG.SUPABASE_ANON_KEY = key;
    CONFIG.DEMO_MODE = false;
    showToast('Konekte ✓ — rechaje paj la');
    setTimeout(() => location.reload(), 1200);
  } else {
    showToast('Antre URL ak Anon Key !');
  }
}

// ─────────────────────────────────────────────
//  MAP INIT
// ─────────────────────────────────────────────

function initMap(containerId = 'leaflet-map') {
  const el = document.getElementById(containerId);
  if (!el || el._map_init) return;
  el._map_init = true;

  const map = L.map(el, {
    zoomControl: false,
    attributionControl: false,
  }).setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    className: 'map-tiles',
  }).addTo(map);

  // Dark filter on tiles
  el.style.filter = 'brightness(0.65) contrast(1.1) saturate(0.8)';

  // User marker
  const userIcon = L.divIcon({
    html: '<div style="width:18px;height:18px;border-radius:50%;background:#ff7733;border:3px solid #fff;box-shadow:0 2px 8px rgba(255,119,51,.6)"></div>',
    className: '', iconAnchor: [9,9]
  });
  L.marker(CONFIG.MAP_CENTER, { icon: userIcon }).addTo(map);

  // Driver markers
  const driverIcon = L.divIcon({
    html: '<div style="width:32px;height:32px;border-radius:50%;background:#ffd23f;border:2px solid #14110d;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.4)">🏍</div>',
    className: '', iconAnchor: [16,16]
  });
  DEMO_DRIVERS.slice(0,3).forEach(d => {
    L.marker([d.lat, d.lng], { icon: driverIcon }).addTo(map)
      .bindPopup(`<b>${d.name}</b><br/>${d.vehicle}`);
  });

  // Destination marker (for ride screens)
  if (['vehicle-select','driver-found','ride-inprogress','ride-done'].includes(state.screen)) {
    const destIcon = L.divIcon({
      html: '<div style="width:18px;height:18px;border-radius:50%;background:#22c55e;border:3px solid #fff;box-shadow:0 2px 8px rgba(34,197,94,.6)"></div>',
      className: '', iconAnchor: [9,9]
    });
    L.marker([18.1965, -73.7460], { icon: destIcon }).addTo(map);

    // Route line
    L.polyline([CONFIG.MAP_CENTER, [18.1965, -73.7460]], {
      color: '#ff7733', weight: 3, dashArray: '8 6', opacity: 0.8
    }).addTo(map);

    map.fitBounds([[CONFIG.MAP_CENTER, [18.1965, -73.7460]]], { padding: [40,40] });
  }

  state.map = map;

  // Animate driver positions
  setInterval(() => {
    DEMO_DRIVERS.forEach(d => {
      d.lat += (Math.random() - 0.5) * 0.0002;
      d.lng += (Math.random() - 0.5) * 0.0002;
    });
  }, 2000);
}

const SCREENS = {
  splash: ScreenSplash,
  onboarding: ScreenOnboarding,
  login: ScreenLogin,
  otp: ScreenOTP,
  register: ScreenRegister,
  home: ScreenHome,
  'vehicle-select': ScreenVehicleSelect,
  searching: ScreenSearching,
  'driver-found': ScreenDriverFound,
  'ride-inprogress': ScreenRideInProgress,
  'ride-done': ScreenRideDone,
  payment: ScreenPayment,
  'payment-done': ScreenPaymentDone,
  'rate-driver': ScreenRateDriver,
  chat: ScreenChat,
  wallet: ScreenWallet,
  'wallet-topup': ScreenWalletTopup,
  history: ScreenHistory,
  profile: ScreenProfile,
  notifications: ScreenNotifications,
  settings: ScreenSettings,
  'driver-home': ScreenDriverHome,
  'driver-ride-request': ScreenDriverRideRequest,
  'driver-onway': ScreenDriverOnWay,
  'driver-in-ride': ScreenDriverInRide,
  'driver-ride-done': ScreenDriverRideDone,
  'driver-earnings': ScreenDriverEarnings,
  'driver-history': () => `<div class="screen"><div class="topbar"><button class="topbar-back" onclick="navigate('driver-home')">←</button><div class="topbar-title">Istwa kous</div></div><div class="pad scroll-area"><p class="muted" style="text-align:center;margin-top:40px">Kous yo ap chaje…</p></div></div>`,
  'driver-chat': () => { state.currentRide = state.currentRide || { driver: DEMO_DRIVERS[0] }; return ScreenChat(); },
  'driver-notifications': ScreenNotifications,
  'admin-dashboard': ScreenAdminDashboard,
};

function render() {
  const app = document.getElementById('app');
  const screenFn = SCREENS[state.screen];
  if (!screenFn) { navigate('home'); return; }

  app.innerHTML = screenFn();

  // Show connection status
  if (!supabase && !['splash','onboarding','login','otp'].includes(state.screen)) {
    const banner = document.createElement('div');
    banner.id = 'supabase-banner';
    banner.innerHTML = '⏳ Koneksyon Supabase ap chaje…';
    app.prepend(banner);
  }

  // Init map if needed
  setTimeout(() => {
    if (document.getElementById('leaflet-map')) initMap('leaflet-map');
    if (document.getElementById('leaflet-map-mini')) initMap('leaflet-map-mini');
  }, 60);
}

document.addEventListener('DOMContentLoaded', () => {
  initSupabase();
  render();
});
